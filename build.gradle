plugins {
    id 'java'
    id 'checkstyle'
    id 'pmd'
    id 'jacoco'
    id 'nebula.lint' version '20.6.2'
}

group 'no.unit.bibs'
version '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven { url "https://jitpack.io" }
}

wrapper {
    distributionType = Wrapper.DistributionType.ALL
    gradleVersion = "8.14.6"
}


dependencies {

    implementation "org.slf4j:slf4j-api:2.0.20"

    implementation "com.fasterxml.jackson.core:jackson-annotations:2.23"
    implementation "com.fasterxml.jackson.core:jackson-core:2.22.4"
    implementation "com.fasterxml.jackson.core:jackson-databind:2.22.4"

    implementation "com.amazonaws:aws-lambda-java-core:1.4.1"
    implementation "software.amazon.awssdk:dynamodb:2.57.4"
    implementation "software.amazon.awssdk:s3:2.57.4"
    implementation "software.amazon.awssdk:aws-core:2.57.4"
    implementation "software.amazon.awssdk:regions:2.57.4"
    implementation "software.amazon.awssdk:sdk-core:2.57.4"

    implementation "org.apache.commons:commons-text:1.15.0"
    implementation "org.apache.commons:commons-lang3:3.22.0"

    implementation "com.github.bibsysdev:json:2.11.2"
    implementation "com.github.bibsysdev:core:2.11.2"
    implementation "com.github.bibsysdev:apigateway:2.11.2"

    testImplementation "com.github.bibsysdev:nvatestutils:2.11.2"
    testImplementation "software.amazon.awssdk:http-client-spi:2.57.4"
    testImplementation "org.hamcrest:hamcrest:3.0"
    testImplementation "org.mockito:mockito-core:5.24.0"
    testImplementation "org.junit.jupiter:junit-jupiter-api:6.1.3"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter:6.1.3"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:6.1.3"

    pmdAux javaToolchains.launcherFor(java.toolchain)
            .map { it.metadata.installationPath }
            .map { it.files("lib/jrt-fs.jar") }
}

gradleLint {
    rules = ['all-dependency']
    reportFormat = 'html'
    reportOnlyFixableViolations = true
}

test {

    useJUnitPlatform()
    failFast = true
    finalizedBy jacocoTestReport
    testLogging {
        events "SKIPPED", "FAILED"
    }
    environment("COGNITO_AUTHORIZER_URLS", "https://test/jwks.json,https://test2/jwks.json")
}

pmd {
    toolVersion = '7.28.0'
    ruleSetConfig = rootProject.resources.text.fromFile('config/pmd/ruleset.xml')
    ruleSets = []
    ignoreFailures = false

}

checkstyle {
    toolVersion = '14.4.0'
    configFile = rootProject.resources.text.fromFile('config/checkstyle/checkstyle.xml').asFile()
    showViolations = true
}

tasks.withType(Checkstyle).configureEach {
    reports {
        html.required
        html.stylesheet = rootProject.resources.text.fromFile('config/checkstyle/checkstyle-simple.xsl')
    }
}

jacocoTestReport {
    reports {
        html.outputLocation.set(layout.buildDirectory.dir("reports/jacoco"))
    }
}

jacoco {
    toolVersion = "0.8.16"
}

check.dependsOn jacocoTestCoverageVerification
jacocoTestCoverageVerification.dependsOn(jacocoTestReport)

jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                counter = 'METHOD'
                value = 'COVEREDRATIO'
                minimum = 0.90
            }
        }

        rule {
            limit {
                counter = 'CLASS'
                value = 'COVEREDRATIO'
                minimum = 1.0
            }
        }
    }
}

